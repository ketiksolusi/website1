<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ketik Solusi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>tailwind.config = { theme: { extend: { colors: { navy: '#1e3a5f', teal: '#2bb4ab', orange: '#ff8c00' } } } }</script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="glass-card p-8 rounded-3xl shadow-2xl w-full max-w-md bg-white">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-navy text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-paper-plane text-orange"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-navy">Selamat Datang Kembali</h2>
            <p class="text-sm text-gray-500">Login untuk melacak progres tugasmu</p>
        </div>

        <form class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="email" placeholder="email@contoh.com" class="w-full border border-gray-300 pl-10 p-3 rounded-lg focus:ring-2 focus:ring-teal outline-none" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="password" placeholder="********" class="w-full border border-gray-300 pl-10 p-3 rounded-lg focus:ring-2 focus:ring-teal outline-none" required>
                </div>
                <div class="text-right mt-1"><a href="#" class="text-xs text-teal hover:underline">Lupa Password?</a></div>
            </div>
            
            <button type="submit" class="w-full bg-navy text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition shadow-lg mt-4">
                Masuk ke Dashboard
            </button>
            <button type="button" class="w-full bg-white border-2 border-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-red-500"></i> Masuk dengan Google
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">Belum punya akun? <a href="#" class="text-orange font-bold hover:underline">Daftar Sekarang</a></p>
        <p class="text-center mt-4"><a href="index.html" class="text-xs text-gray-400 underline">Kembali ke Beranda</a></p>
    </div>

</body>
</html>
